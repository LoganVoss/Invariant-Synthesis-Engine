[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "invariant-synthesis"
version = "0.1.0"
description = "Counterexample-guided discovery of robust coordinates for complex dynamical systems"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Logan Voss" }]
keywords = [
  "invariant-discovery",
  "symbolic-regression",
  "dynamical-systems",
  "scientific-machine-learning",
  "observability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
ise = "invariant_synthesis.cli:main"

[project.urls]
Homepage = "https://github.com/LoganVoss/invariant-synthesis-engine"
Issues = "https://github.com/LoganVoss/invariant-synthesis-engine/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/invariant_synthesis"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
